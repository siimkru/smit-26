spring:
  application:
    name: smit-it-agent
  ai:
    # The application constructs its OpenAI client only when both key and model
    # are configured, so health remains available without a key.
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_MODEL:}
          temperature: ${OPENAI_TEMPERATURE:0.2}
agent:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:}
    temperature: ${OPENAI_TEMPERATURE:0.2}
