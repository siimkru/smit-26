name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: '37 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: github/codeql-action/init@311b4ee155dcdab395044f00946f664bd51ff173 # v4.37.4
        with:
          languages: java
          build-mode: manual
      - run: ./gradlew classes -x test
      - uses: github/codeql-action/analyze@311b4ee155dcdab395044f00946f664bd51ff173 # v4.37.4
