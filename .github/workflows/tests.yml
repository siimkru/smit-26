name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Scan repository and Git history for secrets
        uses: gitleaks/gitleaks-action@v2

      - name: Scan dependency changes for known vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

      - name: Run unit tests and static checks
        run: ./gradlew check

      - name: Upload unit-test HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-html-report
          path: build/reports/tests/test/
          if-no-files-found: error

      - name: Run real OpenAI integration tests when configured
        if: always()
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          ./gradlew integrationTest
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$OPENAI_MODEL" ]; then
            echo "::warning::Real OpenAI integration tests were skipped because credentials are not configured."
            echo "### OpenAI integration tests: skipped (credentials unavailable)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$CI_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "A manually requested integration validation must execute the real provider tests." >&2
              exit 1
            fi
          else
            echo "### OpenAI integration tests: executed against the real provider" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload integration-test HTML report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-html-report
          path: build/reports/tests/integrationTest/
          if-no-files-found: error
