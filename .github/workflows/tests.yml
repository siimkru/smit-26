name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload unit-test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-html-report
          path: build/reports/tests/test/
          if-no-files-found: error

      - name: Run real OpenAI integration tests when configured
        if: always()
        run: ./gradlew integrationTest

      - name: Upload integration-test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-html-report
          path: build/reports/tests/integrationTest/
          if-no-files-found: error
